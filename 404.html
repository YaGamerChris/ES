<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ya! Gamer Chris | Error 404</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#09090d">
    <meta name="description" content="La página que buscas no está disponible. Regresa al inicio de Ya! Gamer Chris.">

    <link rel="icon" href="https://yagamerchris.github.io/C.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            color-scheme: dark;

            --background: #09090d;
            --surface: #111116;
            --accent: #3c9fff;
            --accent-hover: #7abfff;
            --text: #f7f7fb;
            --muted: #a1a1b3;
            --border: rgba(255, 255, 255, 0.10);
            --accent-soft: rgba(60, 159, 255, 0.08);
            --accent-border: rgba(60, 159, 255, 0.20);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            flex-direction: column;

            overflow-x: hidden;

            background:
                radial-gradient(
                    ellipse at 50% 35%,
                    rgba(60, 159, 255, 0.075),
                    transparent 55%
                ),
                var(--background);

            color: var(--text);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 5px;
            border-radius: 4px;
        }

        /* Encabezado */

        .header {
            width: 100%;
            padding: 25px 6%;
            border-bottom: 1px solid var(--border);
        }

        .header-inner {
            width: 100%;
            max-width: 1200px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 12px;

            font-size: 17px;
            font-weight: 800;
            letter-spacing: -0.6px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;

            display: grid;
            place-items: center;
            flex-shrink: 0;
            overflow: hidden;

            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
        }

        .brand-icon img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .brand-name span {
            color: var(--accent);
        }

        /* Contenido principal */

        main {
            width: 100%;
            flex: 1;

            display: grid;
            place-items: center;

            padding: 75px 24px 85px;
        }

        .error-content {
            width: 100%;
            max-width: 760px;
            margin: auto;
            text-align: center;

            animation: appear 800ms ease both;
        }

        /* Ilustración del error */

        .error-art {
            position: relative;

            width: 160px;
            height: 160px;

            display: grid;
            place-items: center;

            margin: 0 auto 32px;

            border: 1px solid var(--accent-border);
            border-radius: 42px;

            background: linear-gradient(
                145deg,
                rgba(60, 159, 255, 0.09),
                rgba(255, 255, 255, 0.015)
            );

            box-shadow: 0 20px 90px rgba(0, 0, 0, 0.22);

            transform: rotate(-4deg);
        }

        .error-art svg {
            width: 82px;
            height: 82px;

            stroke: var(--accent);
            stroke-width: 1.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Textos */

        .error-code {
            display: inline-block;
            margin-bottom: 15px;

            color: var(--accent);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 2px;
            line-height: 1.7;
            text-transform: uppercase;
        }

        h1 {
            margin-bottom: 15px;

            font-size: clamp(36px, 7vw, 66px);
            font-weight: 900;
            letter-spacing: -3px;
            line-height: 1.08;

            overflow-wrap: break-word;
        }

        h1 span {
            color: var(--accent);
        }

        .description {
            max-width: 510px;
            margin: 0 auto;

            color: var(--muted);
            font-size: 16px;
            line-height: 1.8;
        }

        /* Botones */

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 13px;

            margin-top: 32px;
        }

        .button {
            min-height: 50px;

            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 10px;

            padding: 0 23px;

            border: 1px solid var(--border);
            border-radius: 14px;

            font-family: inherit;
            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 180ms ease,
                background 180ms ease,
                border-color 180ms ease;
        }

        .button:hover {
            transform: translateY(-3px);
        }

        .button-primary {
            border-color: var(--accent);
            background: var(--accent);
            color: #09090d;
        }

        .button-primary:hover {
            border-color: var(--accent-hover);
            background: var(--accent-hover);
        }

        .button-secondary {
            border-color: var(--border);
            background: rgba(255, 255, 255, 0.035);
            color: var(--text);
        }

        .button-secondary:hover {
            border-color: var(--accent-border);
            background: var(--accent-soft);
        }

        /* Enlace complementario */

        .suggestion {
            margin-top: 42px;

            color: #777789;
            font-size: 12px;
            line-height: 1.8;
        }

        .suggestion a {
            color: var(--accent);
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        /* Pie de página */

        .footer {
            width: 100%;
            padding: 24px;
            border-top: 1px solid var(--border);
        }

        .footer-inner {
            max-width: 1200px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .footer p {
            color: #777789;
            font-size: 12px;
            line-height: 1.7;
        }

        .footer strong {
            color: var(--text);
            font-weight: 700;
        }

        .footer-tag {
            color: var(--accent) !important;
            font-weight: 700;
        }

        /* Animación de entrada */

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Adaptación a dispositivos móviles */

        @media (max-width: 600px) {
            .header {
                padding: 18px 20px;
            }

            .brand {
                font-size: 14px;
                gap: 9px;
            }

            .brand-icon {
                width: 34px;
                height: 34px;
                border-radius: 10px;
            }

            main {
                padding: 60px 22px;
            }

            .error-art {
                width: 125px;
                height: 125px;
                margin-bottom: 30px;
                border-radius: 34px;
            }

            .error-art svg {
                width: 66px;
                height: 66px;
            }

            .error-code {
                font-size: 11px;
                letter-spacing: 1.5px;
            }

            h1 {
                letter-spacing: -1.8px;
            }

            .description {
                font-size: 14px;
            }

            .buttons {
                flex-direction: column;
                width: 100%;
            }

            .button {
                width: 100%;
            }

            .footer-inner {
                flex-direction: column;
                text-align: center;
            }
        }

        /* Accesibilidad: reducir movimiento */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="header-inner">

            <a
                class="brand"
                href="https://yagamerchris.github.io/ES/"
                aria-label="Ya! Gamer Chris, volver al inicio"
            >
                <span class="brand-icon">
                    <img
                        src="https://yagamerchris.github.io/icon.png"
                        alt=""
                        width="40"
                        height="40"
                    >
                </span>

            </a>

        </div>
    </header>

    <main>
        <section
            class="error-content"
            aria-labelledby="error-title"
        >
            
            <p class="error-code">
                Error 404 — No encontramos lo que buscas
            </p>

            <h1 id="error-title">
                ¡Ups!<br>
                <span>Game Over...</span>
            </h1>

            <p class="description">
                Parece que esta página perdió el juego.
                La dirección puede ser incorrecta o el contenido
                pudo haber cambiado de lugar.
            </p>

            <div class="buttons">

                <a
                    class="button button-primary"
                    href="https://yagamerchris.github.io/"
                >
                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path d="m3 10 9-7 9 7"></path>
                        <path d="M5 9v12h14V9"></path>
                        <path d="M9 21v-7h6v7"></path>
                    </svg>

                    Volver al inicio
                </a>

            </div>

        </section>
    </main>

    <footer class="footer">
        <div class="footer-inner">

            <p>
                © <span id="current-year">2026</span>
                <strong>ChrisWorld™</strong>.
                Todos los derechos reservados.
            </p>

        </div>
    </footer>

    <script>
        document.getElementById('current-year').textContent =
            new Date().getFullYear();
    </script>

</body>
</html>
